# === 目标版本矩阵 ===
# minecraft_version = 本分支编译基座（= 该范围里上游源码实际对齐的那一版）
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
fabric_minecraft_range=>=26.3 <26.4
# 区间标签：目录名 = 分支名 = 产物里的 MC 段
mc_range_label=26.3
neo_form_version=26.3-1

# Fabric（https://fabricmc.net/develop/）
fabric_version=0.164.0+26.3
fabric_loader_version=0.19.5

# NeoForge（https://projects.neoforged.net/neoforged/neoforge）
neoforge_version=26.3.0.1-beta
neoforge_version_range=[26.3,)
neoforge_loader_version_range=[4,]

# 钛 Lite（内嵌，jarjar）：Titanium-Re 同范围分支构建后把两者放进 libs/（不入库）
titanium_version=4.0
titanium_minecraft_range=[26.3, 26.4)

